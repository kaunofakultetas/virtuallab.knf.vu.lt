name: virtual-lab-dev

# Development counterpart of docker-compose.yml: same services, but source
# mounted for hot reload and ports published on the loopback interface. No
# container_name here, so a dev stack can run beside the production one.

services:
    virtual-lab-postgres:
        image: postgres:17-alpine
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: dev-postgres
            POSTGRES_DB: backend_db
        volumes:
            - postgres_dev_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
            interval: 2s
            timeout: 3s
            retries: 15
        ports:
            - "127.0.0.1:5432:5432"

    virtual-lab-backend:
        image: node:25-alpine
        working_dir: /app
        command: sh -c "npm ci && npm run dev"
        env_file:
            - ./.env
            - ./.env.development
        environment:
            NODE_ENV: development
            DATABASE_URL: postgresql://postgres:dev-postgres@virtual-lab-postgres:5432/backend_db
            PORT: 3000
        volumes:
            - ./backend:/app
            - backend_dev_node_modules:/app/node_modules
            - ./certs:/certs:ro
        depends_on:
            virtual-lab-postgres:
                condition: service_healthy
        ports:
            - "127.0.0.1:3000:3000"

    virtual-lab-vite:
        image: node:22-alpine
        working_dir: /app
        command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
        environment:
            VITE_API_PROXY_TARGET: http://virtual-lab-backend:3000
        volumes:
            - ./vite:/app
            - vite_dev_node_modules:/app/node_modules
        depends_on:
            - virtual-lab-backend
        ports:
            - "127.0.0.1:5173:5173"

    virtual-lab-docs:
        image: node:22-alpine
        profiles: ["docs"]
        working_dir: /app
        command: sh -c "apk add --no-cache git && npm ci && npm run start -- --host 0.0.0.0"
        volumes:
            - ./docs:/app
            - docs_dev_node_modules:/app/node_modules
        ports:
            - "127.0.0.1:3001:3000"

volumes:
    postgres_dev_data:
    backend_dev_node_modules:
    vite_dev_node_modules:
    docs_dev_node_modules:
