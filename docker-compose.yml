name: virtual-lab

services:
    frontend:
        # TODO: Change to build when prod-ready
        image: node:22-alpine
        container_name: frontend
        working_dir: /app
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
        volumes:
            - ./frontend:/app
        networks:
            - isolated
        restart: unless-stopped

    backend:
        build:
            context: ./backend
        container_name: backend

        env_file: ./.env
        environment:
            - DATABASE_URL=postgresql://postgres:password@postgres:5432/backend_db
            - NODE_EXTRA_CA_CERTS=/certs/logs.knf.vu.lt.crt

        volumes:
            - ./certs/logs.knf.vu.lt.crt:/certs/logs.knf.vu.lt.crt:ro

        read_only: true
        networks:
            - isolated
        extra_hosts:
            - "logs.knf.vu.lt:172.18.3.30"
        restart: unless-stopped

    caddy:
        image: caddy:2-alpine
        container_name: caddy

        ports:
            - 80:80
            - 443:443
            - 443:443/udp

        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            - ./CaddyAccess.log:/var/log/caddy/access.log
            - caddy_data:/data
            - caddy_config:/config

        networks:
            - external
            - isolated
        restart: unless-stopped

    exit:
        image: vuknf/caddy-l4:2.11
        container_name: exit
        user: 1000:1000
        read_only: true
        volumes:
            - ./exit/Caddyfile:/etc/caddy/Caddyfile:ro
        networks:
            isolated:
                ipv4_address: 172.18.3.30
            external: {}
        restart: unless-stopped

    postgres:
        image: postgres:17-alpine
        container_name: postgres

        read_only: true
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: password
            POSTGRES_DB: backend_db

        volumes:
            - ./_DATA/postgres:/var/lib/postgresql/data
        tmpfs:
            - /run/postgresql
            - /tmp

        healthcheck:
            test:
                ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
            interval: 10s
            timeout: 5s
            retries: 5

        networks:
            - isolated
        restart: unless-stopped

    notfound404-vite:
        container_name: notfound404
        image: vuknf/notfound404-vite:latest
        user: 1000:1000
        read_only: true

        networks:
            - isolated
        restart: unless-stopped

volumes:
    caddy_data:
    caddy_config:

networks:
    external:
        external: true

    isolated:
        name: vl-isolated
        driver: bridge
        internal: true
        ipam:
            config:
                - subnet: 172.18.3.0/24
                  gateway: 172.18.3.1
