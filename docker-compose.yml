name: virtual-lab

services:

    # ------------------------------------------------------------
    #                Incoming and outgoing endpoints
    # ------------------------------------------------------------
    virtual-lab-endpoint:
        container_name: virtual-lab-endpoint
        build:
            context: .
            dockerfile: endpoint/Dockerfile
        image: virtual-lab-endpoint:${VIRTUAL_LAB_IMAGE_TAG:-local}

        environment:
            CADDY_IP_HTTP_HOST: ${CADDY_IP_HTTP_HOST:-disabled.invalid}

        ports:
            - 80:80
            - 443:443
            - 443:443/udp
            - 8888:8888

        volumes:
            - ./endpoint/Caddyfile:/etc/caddy/Caddyfile:ro
            - ./_LOGS:/var/log/caddy:rw
            - caddy_data:/data
            - caddy_config:/config

        networks:
            - external
            - isolated
        restart: unless-stopped


    virtual-lab-exit:
        container_name: virtual-lab-exit
        image: vuknf/caddy-l4:2.11
        user: 1000:1000
        read_only: true
        environment:
            # Caddy substitutes {$PROXMOX_HOST_ADDRESS} when it adapts the
            # Caddyfile, so this must be present in the container, not just on
            # the Compose host.
            - PROXMOX_HOST_ADDRESS=${PROXMOX_HOST_ADDRESS:?Set PROXMOX_HOST_ADDRESS in .env}
        volumes:
            - ./exit/Caddyfile:/etc/caddy/Caddyfile:ro
        networks:
            isolated:
                ipv4_address: 10.10.11.30
                # Deployed .env files address this container as `exit:8006`,
                # `exit:8080` and `*_HOST=exit`. The alias keeps those resolving
                # after the rename, so no deployment needs a lockstep .env edit.
                aliases:
                    - exit
            external: {}
        restart: unless-stopped


    # Served by the endpoint for any hostname the stack does not answer for.
    virtual-lab-notfound404:
        container_name: virtual-lab-notfound404
        image: vuknf/notfound404-vite:latest
        user: 1000:1000
        read_only: true

        networks:
            - isolated
        restart: unless-stopped
    # ------------------------------------------------------------
    # ------------------------------------------------------------
    # ------------------------------------------------------------




    # ------------------------------------------------------------
    #                       Application stack
    # ------------------------------------------------------------
    virtual-lab-backend:
        container_name: virtual-lab-backend
        build:
            context: ./backend
        image: virtual-lab-backend:${VIRTUAL_LAB_IMAGE_TAG:-local}

        env_file: ./.env
        environment:
            - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@virtual-lab-postgres:5432/${POSTGRES_DB:-backend_db}
            - NODE_EXTRA_CA_CERTS=/certs/logs.knf.vu.lt.crt
            - ACCESS_OBSERVER_IDENTITY_FILE=/run/access-observer/id_ed25519
            - ACCESS_OBSERVER_KNOWN_HOSTS_FILE=/run/access-observer/known_hosts
            - ACCESS_APPLIER_IDENTITY_FILE=/run/access-applier/id_ed25519
            - ACCESS_APPLIER_KNOWN_HOSTS_FILE=/run/access-applier/known_hosts
            - ACCESS_TRUNK_APPLIER_IDENTITY_FILE=/run/access-trunk-applier/id_ed25519
            - ACCESS_TRUNK_APPLIER_KNOWN_HOSTS_FILE=/run/access-trunk-applier/known_hosts
            - GATEWAY_OBSERVER_IDENTITY_FILE=/run/gateway-observer/id_ed25519
            - GATEWAY_OBSERVER_KNOWN_HOSTS_FILE=/run/gateway-observer/known_hosts
            - GATEWAY_APPLIER_IDENTITY_FILE=/run/gateway-applier/id_ed25519
            - GATEWAY_APPLIER_KNOWN_HOSTS_FILE=/run/gateway-applier/known_hosts

        volumes:
            - ./certs/:/certs/:ro
            - ${ACCESS_OBSERVER_CREDENTIALS_DIR:?Set ACCESS_OBSERVER_CREDENTIALS_DIR in .env}:/run/access-observer:ro
            # The two Access mutating principals. Optional in the same sense the
            # Gateway applier is: without them provisioning in active mode
            # refuses, which is the correct outcome for an unconfigured stack.
            - ${ACCESS_APPLIER_CREDENTIALS_DIR:-./infra/gateway/credentials-absent}:/run/access-applier:ro
            - ${ACCESS_TRUNK_APPLIER_CREDENTIALS_DIR:-./infra/gateway/credentials-absent}:/run/access-trunk-applier:ro
            # Gateway observation is optional, so this defaults to a committed
            # empty directory rather than failing Compose validation. Without the
            # credentials the dry-run reports no Gateway checks; it does not fail.
            - ${GATEWAY_OBSERVER_CREDENTIALS_DIR:-./infra/gateway/credentials-absent}:/run/gateway-observer:ro
            # The mutating principal. Also optional: without it the apply CLI
            # refuses, which is the correct outcome for an unconfigured stack.
            - ${GATEWAY_APPLIER_CREDENTIALS_DIR:-./infra/gateway/credentials-absent}:/run/gateway-applier:ro

        depends_on:
            virtual-lab-postgres:
                condition: service_healthy

        read_only: true
        networks:
            - isolated
        extra_hosts:                            # every external host the backend
            - "logs.knf.vu.lt:10.10.11.30"      # may reach — pinned to the exit
            - "sso.vu.lt:10.10.11.30"           # container
        restart: unless-stopped


    virtual-lab-postgres:
        container_name: virtual-lab-postgres
        image: postgres:17-alpine

        read_only: true
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
            POSTGRES_DB: ${POSTGRES_DB:-backend_db}

        volumes:
            - ./_DATA/postgres:/var/lib/postgresql/data
        tmpfs:
            - /run/postgresql
            - /tmp

        healthcheck:
            test:
                ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
            interval: 10s
            timeout: 5s
            retries: 5

        networks:
            - isolated
        restart: unless-stopped
    # ------------------------------------------------------------
    # ------------------------------------------------------------
    # ------------------------------------------------------------




    # ------------------------------------------------------------
    #               Additional administration tools
    # ------------------------------------------------------------
    # Ships the endpoint access log to Loki. Reaches logs.knf.vu.lt through the
    # exit container like every other outbound dependency.
    virtual-lab-fluentbit:
        container_name: virtual-lab-fluentbit
        image: fluent/fluent-bit:5.0.6
        profiles: ["logging"]
        user: 1000:1000
        read_only: true
        environment:
            - LOKI_HOST=logs.knf.vu.lt
            - LOKI_USER=${CADDY_LOKI_USER}
            - LOKI_PASSWORD=${CADDY_LOKI_PASS}
            - LOKI_PORT=443
            - LOG_LEVEL=info
            - SERVICE_NAME=${CADDY_LOKI_USER}
        tmpfs:
            - /tmp:uid=1000,gid=1000
        volumes:
            # FluentBit configuration files
            - ./fluentbit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
            - ./fluentbit/parsers.conf:/fluent-bit/etc/parsers.conf:ro

            # Endpoint logs directory
            - ./_LOGS:/var/log/caddy:ro
        extra_hosts:
            - "logs.knf.vu.lt:10.10.11.30"
        networks:
            - isolated
        restart: unless-stopped
    # ------------------------------------------------------------
    # ------------------------------------------------------------
    # ------------------------------------------------------------




volumes:
    caddy_data:
    caddy_config:

networks:
    external:
        external: true                          # created once by the operator

    isolated:
        name: vl-isolated
        driver: bridge
        internal: true                          # no internet from this network
        ipam:
            config:
                - subnet: 10.10.11.0/24
                  gateway: 10.10.11.1
