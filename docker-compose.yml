name: virtual-lab

services:
    frontend:
        build:
            context: ./frontend
        container_name: frontend
        # Dev mode (replace with image: node:22-alpine, working_dir: /app, volumes: [./frontend:/app]):
        # command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
        networks:
            - isolated
        restart: unless-stopped

    backend:
        build:
            context: ./backend
        container_name: backend

        env_file: ./.env
        environment:
            - DATABASE_URL=postgresql://postgres:password@postgres:5432/backend_db
            - NODE_EXTRA_CA_CERTS=/certs/logs.knf.vu.lt.crt

        volumes:
            - ./certs/:/certs/:ro

        read_only: true
        networks:
            - isolated
        extra_hosts:
            - "logs.knf.vu.lt:172.18.3.30"
            - "sso.vu.lt:172.18.3.30"
        restart: unless-stopped

    caddy:
        image: caddy:2-alpine
        container_name: caddy

        ports:
            - 80:80
            - 443:443
            - 443:443/udp

        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            - ./_DATA/caddy_logs:/var/log/caddy:rw
            - caddy_data:/data
            - caddy_config:/config

        networks:
            - external
            - isolated
        restart: unless-stopped

    caddy-fluentbit:
        container_name: caddy-fluentbit
        image: fluent/fluent-bit:5.0.6
        user: 1000:1000
        read_only: true
        environment:
            - LOKI_HOST=logs.knf.vu.lt
            - LOKI_USER=${CADDY_LOKI_USER}
            - LOKI_PASSWORD=${CADDY_LOKI_PASS}
            - LOKI_PORT=443
            - LOG_LEVEL=info
            - SERVICE_NAME=${CADDY_LOKI_USER}
        tmpfs:
            - /tmp:uid=1000,gid=1000
        volumes:
            # FluentBit configuration files
            - ./fluentbit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
            - ./fluentbit/parsers.conf:/fluent-bit/etc/parsers.conf:ro

            # Caddy logs directory
            - ./_DATA/caddy_logs:/var/log/caddy:ro
        restart: unless-stopped

    exit:
        image: vuknf/caddy-l4:2.11
        container_name: exit
        user: 1000:1000
        read_only: true
        volumes:
            - ./exit/Caddyfile:/etc/caddy/Caddyfile:ro
        networks:
            isolated:
                ipv4_address: 172.18.3.30
            external: {}
        restart: unless-stopped

    postgres:
        image: postgres:17-alpine
        container_name: postgres

        read_only: true
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: password
            POSTGRES_DB: backend_db

        volumes:
            - ./_DATA/postgres:/var/lib/postgresql/data
        tmpfs:
            - /run/postgresql
            - /tmp

        healthcheck:
            test:
                ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
            interval: 10s
            timeout: 5s
            retries: 5

        networks:
            - isolated
        restart: unless-stopped

    notfound404-vite:
        container_name: notfound404
        image: vuknf/notfound404-vite:latest
        user: 1000:1000
        read_only: true

        networks:
            - isolated
        restart: unless-stopped

volumes:
    caddy_data:
    caddy_config:

networks:
    external:
        external: true

    isolated:
        name: vl-isolated
        driver: bridge
        internal: true
        ipam:
            config:
                - subnet: 172.18.3.0/24
                  gateway: 172.18.3.1
