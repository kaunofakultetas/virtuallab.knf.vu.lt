info:
  name: Login
  type: http
  seq: 2

http:
  method: POST
  url: "{{API_URL}}/auth/login"
  body:
    type: json
    data: |-
      {
        "username": "{{USERNAME}}",
        "password": "{{PASSWORD}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
