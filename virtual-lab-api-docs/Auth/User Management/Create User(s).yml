info:
  name: Create User(s)
  type: http
  seq: 3

http:
  method: POST
  url: "{{API_URL}}/auth/users"
  body:
    type: json
    data: |-
      {
        "users": [
          {
            "vu_id": "1234567",
            "password": "test123!"
          },
          {
            "vu_id": "2345678"
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Bulk create users. Body example:
  ```json
  {
    "users": [
      {
        "vu_id": "1234567",
        "password": "test123!"
      },
      {
        "vu_id": "2345678"
      }
    ]
  }
  ```
  If a password is not provided, it will be automatically generated and returned.

  Example response:
  ```json
  [
    {
      "vu_id": "1234567",
      "success": true,
      "data": {
        "vu_id": "1234567",
        "role": "student"
      }
    },
    {
      "vu_id": "2345678",
      "success": true,
      "data": {
        "vu_id": "2345678",
        "role": "student",
        "password": "b445ac34be58"
      }
    }
  ]
  ```
