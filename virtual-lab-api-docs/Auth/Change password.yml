info:
  name: Change password
  type: http
  seq: 5

http:
  method: POST
  url: "{{API_URL}}/auth/change-password"
  body:
    type: json
    data: |-
      {
        "currentPassword": "{{PASSWORD}}",
        "newPassword": "{{PASSWORD}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
