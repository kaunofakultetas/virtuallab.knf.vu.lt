services:
    guacamole:
        image: abesnier/guacamole:latest
        container_name: guacamole
        restart: unless-stopped
        ports:
            - "8080:8080"
        volumes:
            - ./data:/config

    # Final-hop dynamic proxy for the web-UI feature (see ./Caddyfile).
    vm-web-proxy:
        image: caddy:2-alpine
        container_name: vm-web-proxy
        restart: unless-stopped
        ports:
            - "9443:9443"
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
