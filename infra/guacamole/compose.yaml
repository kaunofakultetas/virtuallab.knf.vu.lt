services:
    guacamole:
        image: abesnier/guacamole:1.6.0@sha256:a9cab142626f512dabbdf0286bed8c11bda8ca86369c31624170ffdd1d60ba74
        container_name: guacamole
        restart: unless-stopped
        ports:
            - "10.10.10.50:8080:8080"
        volumes:
            - ./data:/config

    # Final-hop dynamic proxy for the web-UI feature (see ./Caddyfile).
    vm-web-proxy:
        image: caddy:2-alpine
        container_name: vm-web-proxy
        restart: unless-stopped
        ports:
            - "10.10.10.50:9443:9443"
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
